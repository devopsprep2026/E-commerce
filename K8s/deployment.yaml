apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-app
  namespace: production

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ecommerce-app

  template:
    metadata:
      labels:
        app: ecommerce-app

    spec:
      containers:
      - name: ecommerce-app

        image: 804838453201.dkr.ecr.us-east-1.amazonaws.com/devops-prep:1.0

        ports:
        - containerPort: 8080

        env:
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: username

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password

        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: url
