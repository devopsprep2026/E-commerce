apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ecommerce-db-secret
  namespace: production

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: db-secret
    creationPolicy: Owner

  data:
    - secretKey: username
      remoteRef:
        key: production/e-commerce/db
        property: DB_USERNAME

    - secretKey: password
      remoteRef:
        key: production/e-commerce/db
        property: DB_PASSWORD

    - secretKey: url
      remoteRef:
        key: production/e-commerce/db
        property: DB_URL
